# Buzz relay for PureDesktop shared books, as deployed on Hostinger VPS
# (Docker Manager + the server's Traefik). No secrets in this file: every
# secret comes from the project's environment — see .env.example.
# PureRelays (Nikau-Dev/purerelays) deploys it and fills the environment.
services:
  relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    restart: unless-stopped
    ports:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      BUZZ_DOMAIN: ${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}
      RELAY_URL: wss://${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}
      BUZZ_CORS_ORIGINS: https://${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}
      BUZZ_MEDIA_BASE_URL: https://${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}/media
      BUZZ_MEDIA_SERVER_DOMAIN: ${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}
      DATABASE_URL: postgres://buzz:${DB_PASSWORD}@postgres:5432/buzz
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${S3_SECRET_KEY}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "false"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "false"
      BUZZ_RELAY_PRIVATE_KEY: ${RELAY_PRIVATE_KEY}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${GIT_HOOK_HMAC_SECRET}
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}
      BUZZ_RATE_LIMIT_HUMAN_MESSAGES_PER_MIN: ${BUZZ_RATE_LIMIT_HUMAN_MESSAGES_PER_MIN:-600}
      BUZZ_RATE_LIMIT_HUMAN_WS_EVENTS_PER_SEC: ${BUZZ_RATE_LIMIT_HUMAN_WS_EVENTS_PER_SEC:-20}
      BUZZ_RATE_LIMIT_DOC_EVENTS_PER_MIN: ${BUZZ_RATE_LIMIT_DOC_EVENTS_PER_MIN:-1200}
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      relay-init:
        condition: service_completed_successfully

  relay-init:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/git
        chown -R 1000:1000 /data/git
    volumes:
      - buzz-git-data:/data/git

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "buzz", "-d", "buzz"]
      interval: 25s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 25s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - buzz-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 25s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}"
        mc mb --ignore-existing local/buzz-media
        mc anonymous set none local/buzz-media

volumes:
  buzz-git-data:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-minio-data:
